name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        run: |
          set -euo pipefail
          OUT="/tmp/AndroidsDontCount-${GITHUB_REF_NAME}.zip"
          STAGE="$(mktemp -d)/AndroidsDontCount"
          mkdir -p "$STAGE"
          cp -r About 1.7 README.md "$STAGE/"
          (cd "$(dirname "$STAGE")" && zip -r "$OUT" AndroidsDontCount)
          ls -l "$OUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/AndroidsDontCount-${{{{ github.ref_name }}}}.zip
          generate_release_notes: true
